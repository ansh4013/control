<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Users</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171f;--mut:#6b7280;--bd:#e5e7eb;--ac:#4f46e5;--ok:#16a34a;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0e1117;--card:#161b22;--tx:#e6e8ec;--mut:#8b93a1;--bd:#262d38;--ac:#818cf8;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;max-width:900px;margin:0 auto 12px}
h1{font-size:20px;margin:0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-right:6px}.dot.on{background:var(--ok)}
input,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
input{width:100%;margin-bottom:8px}button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.d{color:var(--bad);border-color:var(--bad);padding:6px 10px}button:disabled{opacity:.5}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:500;font-size:13px}
tr.flash{animation:f 2s}@keyframes f{from{background:rgba(79,70,229,.25)}to{background:transparent}}
.mut{color:var(--mut);font-size:13px}.err{color:var(--bad);font-size:14px;min-height:18px}
</style>
</head>
<body>
<div class="card" id="app">
  <div class="top"><a href="index.html" class="mut" style="text-decoration:none;width:100%">← Control Center</a><h1><span class="dot" id="live"></span>Live users <span class="mut" id="count"></span></h1></div>
  <div class="wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Interest</th><th>Last login</th><th>Status</th><th></th></tr></thead>
  <tbody id="rows"></tbody></table></div>
  <div class="err" id="err"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ===== CONFIG =====
const SUPABASE_URL = "https://hbudhkyftxdqlwcdyotq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_xrX2qILCdLyF7fmrlqMGpA_Pv6D7xYG";
const TABLE = "users";
const COL = { id:"id", name:"name", role:"role", interest:"interest", email:"email", phone:"phone", last:"last_login", flag:"logout_requested" };
// ==================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  global: { fetch: (u, o = {}) => {
    if (o.headers && typeof o.headers.entries === "function") o.headers = Object.fromEntries(o.headers.entries());
    return fetch(u, o);
  } }
});
const $ = id => document.getElementById(id);
const users = new Map();
const kick = sb.channel("force-logout"); kick.subscribe();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = t => t ? new Date(t).toLocaleString() : "—";

function render(flashId){
  const list = [...users.values()].sort((a,b)=> new Date(b[COL.last]||0) - new Date(a[COL.last]||0));
  $("count").textContent = "(" + list.length + ")";
  $("rows").innerHTML = list.map(u => {
    const pending = u[COL.flag];
    return `<tr class="${u[COL.id]===flashId?'flash':''}">
      <td>${esc(u[COL.id])}</td><td>${esc(u[COL.name])}</td><td>${esc(u[COL.email])}</td><td>${esc(u[COL.phone])}</td><td>${esc(u[COL.role])}</td><td>${esc(u[COL.interest])}</td>
      <td>${fmt(u[COL.last])}</td><td>${pending?'Logout sent':'Active'}</td>
      <td><button class="d" data-id="${esc(u[COL.id])}" ${pending?'disabled':''}>Log out</button></td></tr>`;
  }).join("") || `<tr><td colspan="9" class="mut">No users yet.</td></tr>`;
}

async function start(){
    const { data, error } = await sb.from(TABLE).select("*");
  if (error) { $("err").textContent = error.message; return; }
  data.forEach(u => users.set(u[COL.id], u)); render();
  sb.channel("live-users")
    .on("postgres_changes", { event:"*", schema:"public", table:TABLE }, p => {
      if (p.eventType === "DELETE") { users.delete(p.old[COL.id]); render(); return; }
      users.set(p.new[COL.id], p.new); render(p.new[COL.id]);
    })
    .subscribe(s => $("live").classList.toggle("on", s === "SUBSCRIBED"));
}

$("rows").addEventListener("click", async e => {
  const b = e.target.closest("button[data-id]"); if (!b) return;
  b.disabled = true;
  const { error } = await sb.from(TABLE).update({ [COL.flag]: true }).eq(COL.id, b.dataset.id);
  if (error) { $("err").textContent = error.message; b.disabled = false; }
  else kick.send({ type:"broadcast", event:"logout", payload:{ id: Number(b.dataset.id) } });
});

start();
</script>
</body>
</html>
